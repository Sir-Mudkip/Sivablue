---
name: Build container image
on:
  pull_request:
    branches:
      - master
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - master
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "My Customized Universal Blue Image"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "stable"

jobs:
  build_push:
    name: Build and push image (${{ matrix.target }})
    runs-on: ubuntu-24.04

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ matrix.target }}
      cancel-in-progress: true

    strategy:
      matrix:
        include:
          - target: base
            suffix: ""
          - target: nvidia
            suffix: "-nvidia"

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          submodules: recursive

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@517622d6452028f266b7ba4cc9a123b5f58a6b53 # v7
        with:
          remove-codeql: true

      - name: Mount BTRFS for podman storage
        id: container-storage-action
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140 # main
        continue-on-error: true
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}${{ matrix.suffix }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build
        run: |
          set -euo pipefail
          IMG="${{ env.IMAGE_NAME }}${{ matrix.suffix }}"
          TAG="${{ env.DEFAULT_TAG }}"

          LABEL_ARGS=()
          while IFS= read -r line; do
            [ -n "$line" ] && LABEL_ARGS+=(--label "$line")
          done <<< "${{ steps.metadata.outputs.labels }}"

          BUILD_ARGS=()
          if [ -n "${{ matrix.suffix }}" ]; then
            BUILD_ARGS+=(--build-arg "VARIANT=${{ matrix.target }}")
          fi

          sudo podman build \
            -t "localhost/${IMG}:${TAG}" \
            -f ./Containerfile \
            "${BUILD_ARGS[@]}" \
            "${LABEL_ARGS[@]}" \
            .

      - name: Rechunk Image
        run: |
          set -euo pipefail
          IMG="${{ env.IMAGE_NAME }}${{ matrix.suffix }}"
          TAG="${{ env.DEFAULT_TAG }}"

          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            --entrypoint /usr/libexec/bootc-base-imagectl \
            "localhost/${IMG}:${TAG}" \
            rechunk --max-layers 96 \
            "localhost/${IMG}:${TAG}" \
            "localhost/${IMG}:${TAG}-rechunked"

          sudo podman tag "localhost/${IMG}:${TAG}-rechunked" "localhost/${IMG}:${TAG}"
          sudo podman rmi "localhost/${IMG}:${TAG}-rechunked"

      - name: Tag for registry
        run: |
          set -euo pipefail
          IMG="${{ env.IMAGE_NAME }}${{ matrix.suffix }}"
          TAG="${{ env.DEFAULT_TAG }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            sudo podman tag "localhost/${IMG}:${TAG}" "localhost/${IMG}:$tag"
          done

     #- name: Setup Syft
     #  id: setup-syft
     #  uses: anchore/sbom-action/download-syft@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
     #  with:
     #    syft-version: v1.20.0

      #- name: Generate SBOM
      # id: generate-sbom
      # env:
      #   IMAGE: ${{ env.IMAGE_NAME }}${{ matrix.suffix }}
      #   DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
      #   SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
      # run: |
      #   set -euo pipefail
      #   OUTPUT_PATH="$(mktemp -d)/sbom.json"
      #   export SYFT_PARALLELISM=$(($(nproc)*2))
      #   sudo -E $SYFT_CMD "podman:localhost/${IMAGE}:${DEFAULT_TAG}" -o spdx-json=${OUTPUT_PATH}
      #   sudo chown "$(id -u):$(id -g)" "${OUTPUT_PATH}"
      #   echo "OUTPUT_PATH=${OUTPUT_PATH}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        run: |
          set -euo pipefail
          IMG="${{ env.IMAGE_NAME }}${{ matrix.suffix }}"
          DIGEST_FILE="$(mktemp)"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            sudo podman push \
              --digestfile="${DIGEST_FILE}" \
              "localhost/${IMG}:$tag" \
              "${{ env.IMAGE_REGISTRY }}/${IMG}:$tag"
          done
          DIGEST=$(sudo cat "${DIGEST_FILE}")
          sudo rm -f "${DIGEST_FILE}"
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY $IMAGE_FULL:$tag
          done
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

