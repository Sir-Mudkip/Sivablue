name: Cleanup Old Images
on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}

jobs:
  delete-older-than-90:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Cleanup old images
        uses: projectbluefin/actions/bootc-build/ghcr-cleanup@cbd8446f58a079e48f76d81d5bc1c2fdec95d592 # v1
        with:
          # Matches the matrix images (base + nvidia) plus the legacy ubluke names
          packages: sivablue,sivablue-nvidia,ubluke,ubluke-nvidia
          older-than: 90 days
          keep-n-tagged: 7
          keep-n-untagged: 7
          github-token: ${{ secrets.GITHUB_TOKEN }}
