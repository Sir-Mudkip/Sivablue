# Framework laptops need this option for battery charge limiting. The in-tree
# cros_charge-control driver refuses to bind when the EC advertises Framework's
# own charge control, so without it there is no charge_control_end_threshold
# sysfs node and the charge limit silently does not exist.
# Inert on non-Framework hardware: the driver is only loaded where it binds.
options cros_charge_control probe_with_fwk_charge_control=1
